<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play Game – PlayNova</title>
<meta name="description" content="Play free online games on PlayNova.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0c0a1f">
<link rel="canonical" href="https://www.example.com/game.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Play on PlayNova">
<meta property="og:description" content="Free online games – play instantly in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Ctext x='32' y='46' font-size='34' text-anchor='middle'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main" class="wrap">
  <div class="ad-mount" data-ad="top" data-w="728" data-h="90" data-label="Top banner"></div>
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> › <a id="crumbCat" href="index.html#games">Games</a> › <span id="crumbTitle">…</span></nav>

  <div id="notfound" class="prose" hidden>
    <h1>Game not found 😕</h1><p>That game doesn’t exist (or was removed). Pick another one from the <a href="index.html#games">game list</a>.</p>
  </div>

  <div class="game-layout" id="gameLayout">
    <section>
      <div class="game-head">
        <h1><span class="gi" id="gIcon">🎮</span><span id="gTitle">Loading…</span></h1>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" id="favBtn" type="button">♡ Favourite</button>
          <button class="btn btn-sm" id="shareBtn" type="button">🔗 Share</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="start" id="start">
          <div class="big" id="sIcon">🎮</div>
          <h2 id="sTitle"></h2>
          <p id="sDesc"></p>
          <button class="btn btn-play" id="playBtn" type="button"><span class="tri"></span> Play Now</button>
          <div class="loadbar" id="loadbar"><i id="loadfill"></i></div>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn btn-sm" id="fsBtn" type="button">⛶ Fullscreen</button>
        <button class="btn btn-sm" id="restartBtn" type="button">↻ Restart</button>
        <span class="sp"></span>
        <label for="pname">Playing as</label>
        <input id="pname" maxlength="16" autocomplete="nickname" placeholder="Your name">
      </div>

      <div class="ad-mount" data-ad="game" data-w="728" data-h="90" data-label="Below game"></div>

      <div class="panel reveal"><h2>About this game</h2><p id="gDesc"></p><h2 style="margin-top:16px">🎯 How to play</h2><p id="gControls"></p><div class="tags" id="gTags"></div></div>

      <div class="sec-head" style="margin-top:30px"><h2>You may also like</h2></div>
      <div class="grid" id="similar"></div>
    </section>

    <aside class="side">
      <div class="ad-mount" style="margin:0" data-ad="sidebar" data-w="300" data-h="250" data-label="Sidebar rectangle"></div>
      <div class="card reveal"><h3>🏆 Top scores</h3><ul class="mini-board" id="board"></ul></div>
      <div class="card reveal" id="infoCard"></div>
      <div class="ad-mount" style="margin:0" data-ad="sidebar2" data-w="300" data-h="250" data-label="Sidebar rectangle 2"></div>
    </aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/play.js"></script>
</body>
</html>
