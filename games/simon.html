<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Simon Pulse</title><link rel="stylesheet" href="game-base.css">
<style>
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,calc(100vh - 110px),420px);aspect-ratio:1;position:relative}
.pad{border:0;cursor:pointer;opacity:.5;transition:opacity .08s,transform .08s,box-shadow .08s;font:inherit;font-weight:700;font-size:20px;color:rgba(255,255,255,.7)}
.pad:nth-child(1){background:#2ee59d;border-radius:100% 14px 14px 14px}.pad:nth-child(2){background:#ff4d8d;border-radius:14px 100% 14px 14px}
.pad:nth-child(3){background:#ffd23f;border-radius:14px 14px 14px 100%}.pad:nth-child(4){background:#22d3ee;border-radius:14px 14px 100% 14px}
.pad.on{opacity:1;transform:scale(1.04);box-shadow:0 0 50px currentColor,inset 0 0 40px rgba(255,255,255,.5)}
.pad:nth-child(1).on{color:#2ee59d}.pad:nth-child(2).on{color:#ff4d8d}.pad:nth-child(3).on{color:#ffd23f}.pad:nth-child(4).on{color:#22d3ee}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;background:#0b0a1e;border:4px solid #3a2f8f;display:grid;place-items:center;text-align:center;font-weight:700;pointer-events:none;box-shadow:0 0 30px rgba(124,92,255,.6)}
.center small{display:block;font-size:11px;color:#a9a4d6;font-weight:500}.center span{font-size:clamp(24px,8vw,40px);color:#ffd23f}
.stage{border-radius:16px}.overlay{border-radius:16px}.shake{animation:shake .35s}
</style></head><body>
<div id="hud"><span>Round <b id="round">0</b></span><span id="status">Press Start</span><span>Best <b id="best">0</b></span></div>
<div class="stage"><div class="pads" id="pads">
<button class="pad" type="button" data-i="0" aria-label="Green pad">Q</button><button class="pad" type="button" data-i="1" aria-label="Red pad">W</button>
<button class="pad" type="button" data-i="2" aria-label="Yellow pad">A</button><button class="pad" type="button" data-i="3" aria-label="Blue pad">S</button>
<div class="center"><div><small>ROUND</small><span id="rc">0</span></div></div></div>
<div class="overlay" id="ov"><h1>🎵 Simon Pulse</h1><p id="msg">Watch the lights, listen to the tones, then repeat the sequence.<br>Click / tap the pads or press Q W A S.</p><button class="btn" id="go" type="button">Start</button></div></div>
<script src="game-base.js"></script>
<script>
(function () {
  'use strict';
  var pads = GB.$('pads'), P = Array.prototype.slice.call(pads.querySelectorAll('.pad')), TONE = [329.63, 261.63, 220, 164.81];
  var roundEl = GB.$('round'), rc = GB.$('rc'), status = GB.$('status'), bestEl = GB.$('best'), ov = GB.$('ov'), msg = GB.$('msg'), go = GB.$('go');
  var seq = [], pos = 0, accept = false, alive = false, timers = [];
  bestEl.textContent = GB.best();
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function flash(i, ms) { P[i].classList.add('on'); GB.beep(TONE[i], (ms || 300) / 1000, 'sine', .12); later(function () { P[i].classList.remove('on'); }, ms || 300); }
  function show() {
    accept = false; status.textContent = 'Watch…'; var gap = Math.max(260, 620 - seq.length * 22), on = Math.max(180, 400 - seq.length * 14);
    seq.forEach(function (n, k) { later(function () { flash(n, on); }, 700 + k * gap); });
    later(function () { accept = true; pos = 0; status.textContent = 'Your turn!'; }, 700 + seq.length * gap);
  }
  function next() { seq.push(GB.ri(0, 3)); roundEl.textContent = seq.length; rc.textContent = seq.length; show(); }
  function press(i) {
    if (!alive || !accept) return; flash(i, 220);
    if (i !== seq[pos]) { fail(); return; }
    pos++;
    if (pos === seq.length) { accept = false; status.textContent = 'Nice! ✔'; later(next, 800); }
  }
  function fail() {
    alive = false; accept = false; GB.beep(100, .6, 'sawtooth', .1); pads.classList.add('shake'); setTimeout(function () { pads.classList.remove('shake'); }, 400);
    var rounds = seq.length - 1, score = Math.max(0, rounds) * 10, nb = GB.saveBest(score); bestEl.textContent = GB.best(); if (score) GB.report(score);
    later(function () { msg.innerHTML = 'Wrong pad! ❌<br>You reached round <b>' + seq.length + '</b><br>Score <b>' + score + '</b>' + (nb && score ? ' · 🏆 New best!' : ''); go.textContent = 'Try again'; ov.classList.remove('hidden'); }, 700);
  }
  function start() { timers.forEach(clearTimeout); timers = []; seq = []; alive = true; ov.classList.add('hidden'); roundEl.textContent = 0; rc.textContent = 0; later(next, 300); }
  pads.addEventListener('pointerdown', function (e) { var b = e.target.closest('.pad'); if (b) { e.preventDefault(); press(+b.getAttribute('data-i')); } });
  document.addEventListener('keydown', function (e) {
    var i = { q: 0, w: 1, a: 2, s: 3, Q: 0, W: 1, A: 2, S: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key];
    if (i !== undefined) press(i);
    if ((e.key === 'Enter' || e.key === ' ') && !alive) { e.preventDefault(); start(); }
  });
  go.addEventListener('click', start);
})();
</script></body></html>
