<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Snake</title><link rel="stylesheet" href="game-base.css"></head><body>
<div id="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<div class="stage"><canvas id="c" width="480" height="480"></canvas>
<div class="overlay" id="ov"><h1>🐍 Neon Snake</h1><p id="msg">Eat the glowing food. Don’t hit the walls or yourself!<br>Arrow keys / WASD or swipe.</p><button class="btn" id="go" type="button">Play</button></div></div>
<script src="game-base.js"></script>
<script>
(function () {
  'use strict';
  var cv = GB.$('c'), ctx = cv.getContext('2d'), N = 20, S = 24, FX = GB.particles();
  GB.fit(cv);
  var scoreEl = GB.$('score'), bestEl = GB.$('best'), ov = GB.$('ov'), msg = GB.$('msg'), go = GB.$('go');
  var snake, dir, nextDir, food, score, speed, acc = 0, last = 0, running = false, pulse = 0;
  bestEl.textContent = GB.best();
  function placeFood() { do { food = { x: GB.ri(0, N - 1), y: GB.ri(0, N - 1) }; } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; })); }
  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; speed = 135; acc = 0; scoreEl.textContent = 0; placeFood();
  }
  function setDir(x, y) { if (x === -dir.x && y === -dir.y) return; nextDir = { x: x, y: y }; }
  function step() {
    dir = nextDir;
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function (s) { return s.x === h.x && s.y === h.y; })) { end(); return; }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score += 10; scoreEl.textContent = score; speed = Math.max(62, speed - 3);
      FX.burst(food.x * S + S / 2, food.y * S + S / 2, '#ffd23f', 18); GB.beep(660 + score * 2, .09, 'square', .04); placeFood();
    } else snake.pop();
  }
  function end() {
    running = false; GB.beep(120, .5, 'sawtooth', .07);
    snake.forEach(function (s) { FX.burst(s.x * S + S / 2, s.y * S + S / 2, '#ff4d8d', 3); });
    var nb = GB.saveBest(score); bestEl.textContent = GB.best(); GB.report(score);
    msg.innerHTML = 'Game over!<br>Score <b>' + score + '</b>' + (nb ? ' · 🏆 New best!' : '');
    go.textContent = 'Play again'; ov.classList.remove('hidden');
  }
  function start() { reset(); running = true; ov.classList.add('hidden'); }
  function draw(t) {
    pulse = t / 300;
    ctx.fillStyle = '#0e0b2b'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = 'rgba(124,92,255,.10)'; ctx.lineWidth = 1; ctx.beginPath();
    for (var i = 0; i <= N; i++) { ctx.moveTo(i * S, 0); ctx.lineTo(i * S, cv.height); ctx.moveTo(0, i * S); ctx.lineTo(cv.width, i * S); }
    ctx.stroke();
    var r = S / 2.4 + Math.sin(pulse) * 1.6;
    ctx.save(); ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, r, 0, 6.283); ctx.fill(); ctx.restore();
    snake.forEach(function (s, i) {
      var k = i / snake.length; ctx.save(); ctx.shadowColor = '#00f5a0'; ctx.shadowBlur = i === 0 ? 16 : 8;
      ctx.fillStyle = 'hsl(' + (160 - k * 70) + ',100%,' + (60 - k * 18) + '%)';
      var p = i === 0 ? 1 : 2.5; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(s.x * S + p, s.y * S + p, S - 2 * p, S - 2 * p, 7) : ctx.rect(s.x * S + p, s.y * S + p, S - 2 * p, S - 2 * p); ctx.fill(); ctx.restore();
    });
    var h = snake[0]; ctx.fillStyle = '#0b0a1e';
    ctx.beginPath(); ctx.arc(h.x * S + S / 2 + dir.y * 5 + dir.x * 3, h.y * S + S / 2 - dir.x * 5 + dir.y * 3, 2.4, 0, 6.283); ctx.arc(h.x * S + S / 2 - dir.y * 5 + dir.x * 3, h.y * S + S / 2 + dir.x * 5 + dir.y * 3, 2.4, 0, 6.283); ctx.fill();
    FX.draw(ctx);
  }
  function loop(t) {
    requestAnimationFrame(loop); var dt = Math.min(60, t - (last || t)); last = t;
    if (running) { acc += dt; while (acc >= speed && running) { acc -= speed; step(); } }
    draw(t);
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key, m = { ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0] }[k];
    if (m) { e.preventDefault(); if (running) setDir(m[0], m[1]); }
    if ((k === 'Enter' || k === ' ') && !running) { e.preventDefault(); start(); }
  });
  GB.swipe(function (d) { if (!running) return; var m = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] }[d]; setDir(m[0], m[1]); });
  go.addEventListener('click', start);
  reset(); requestAnimationFrame(loop);
})();
</script></body></html>
