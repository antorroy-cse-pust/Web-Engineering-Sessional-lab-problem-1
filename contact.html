<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main" class="wrap">
<article class="prose reveal">

<h1>Contact <span class="grad">Us</span></h1>
<p>Questions, feedback, advertising enquiries or a game you would like us to feature? Send us a message and we will reply as soon as possible.</p>
<form id="cform" novalidate>
  <div class="field"><label for="cname">Your name</label><input id="cname" maxlength="60" autocomplete="name" required></div>
  <div class="field"><label for="cmail">Email address</label><input id="cmail" type="email" maxlength="100" autocomplete="email" required></div>
  <div class="field"><label for="csub">Topic</label>
    <select id="csub"><option>General question</option><option>Report a problem</option><option>Submit a game</option><option>Advertising</option><option>Privacy request</option></select></div>
  <div class="field"><label for="cmsg">Message</label><textarea id="cmsg" maxlength="1500" required></textarea><small id="ccount">0 / 1500</small></div>
  <p class="err" id="cerr" role="alert"></p>
  <button class="btn btn-primary" type="submit">Send message ✉️</button>
</form>
<h2>Other ways to reach us</h2>
<p>Email: <a href="mailto:hello@example.com">hello@example.com</a> (replace with your real address)</p>

</article>
</main>
<div id="site-footer"></div>
